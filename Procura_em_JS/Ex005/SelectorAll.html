<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>querySelectorAll</title>
</head>
<body>
    <h1 class="all">No</h1>
    <p class="all">Yes</p>
    <p class="all">Ok</p>
    <h2 class="all">Vamos</h2>

    <script>
        let classe = window.document.querySelectorAll('.all')

        window.document.write(classe[0].innerHTML)
    </script>

</body>
</html>
