<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <style>
        #cad {
            background-color: aquamarine;
            width: 450px;
            height: 500px;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 27px;
            font-weight: bold;
            color: blue;
            padding: 5px;
        }

        #cadastro #nome {
            margin-bottom: 20px;
        }

        fieldset {
            height: 70%;
        }

         #nome {
            width: 250px;
            height: 30px;
            padding: 0;
            margin-top: 0;
         }

         #idade {
            width: 40px;
            height: 30px;
            padding: 0;
            text-align: center;
         } 

         label {
            font-size: 15px;
            color: black;
         }

        #reg {
            position: relative;
            margin-bottom: 30px;
        }      

         .p {
            font-size: 17px;
            color: black;
            text-align: left;
            margin-top: 0;
         }

         #situação {
            position: absolute;
            width: 77%;
            height: 100px;
            font-size: 15px;
            color: black;
         }

         input {
            margin-top: 20px;
            width: 100px;
            height: 30px;
         }

         #limpar:hover {
            font-size: 18px;
            color: blue;
         }

         #salvar:hover {
            font-size: 18px;
            color: blue;
         }
    </style>

</head>
<body>
    <fieldset>
    <div id="cad">
        <fieldset id="cadastro">
            <legend>Cadastro</legend>
            <label>
                Nome:
            <input type="text" name="nome" id="nome" required>
            </label>

            <label>
                Idade:
                <input type="number" name="idade" id="idade" required placeholder="0">
            </label>

            <fieldset id="reg">
                <legend>Registro</legend>
                <p class="p">Nome:</p>
                <p class="p">Idade:</p>
                <fieldset id="situação">
                    <legend class="p">Situação:</legend>
                </fieldset>
            </fieldset>

            <input type="button" value="salvar" id="salvar" class="botão">
            <input type="button" value="limpar" id="limpar" class="botão">
        </fieldset>
    </div>

    <script>
        let botao = window.document.querySelectorAll('.botão')
        let nome = window.document.querySelector('#nome')
        let idade = window.document.querySelector('#idade')
        let registro = window.document.querySelectorAll('.p')
        let situacao = window.document.getElementById('situação')

        botao[0].addEventListener('click', () => {
            registro[0].textContent = `Nome: ${nome.value}`
            registro[1].textContent = `Idade: ${idade.value}`
            situacao.textContent = Number(idade.value >= 18)?'Pela norma relativa da administração do deparrtamento da instituição pública, no Art. 2034, você está apto para aprovação.':'Pela norma relativa da administração do deparrtamento da instituição pública, no Art. 2034, você não está apto para aprovação.'
            
        });

        botao[1].addEventListener('click', () => {
            nome.value = ''
            idade.value = ''
            registro[0].textContent = `Nome:`
            registro[1].textContent = `Idade:`
            situacao.textContent= ``
        }
    )

    </script>

</body>
</html>
