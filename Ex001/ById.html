<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixando getElementById</title>
</head>
<body>
    <header>
        <h1 id="titulo">Hello, Let's Go!</h1>
    </header>

    <div>
        <p id="msg">Iniciando getElemnetById</p>
    </div>

    <script>

        let titulo = window.document.getElementById('titulo')
        titulo.textContent = 'Olá, Vamos-lá!'

        let mensagem = window.document.getElementById('msg')
        mensagem.style.color = 'blue'
        
    </script>

</body>
</html>
