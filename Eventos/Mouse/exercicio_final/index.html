<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício final</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>
    <header>
        <h1>Cadastro de usuário</h1>
    </header>

    <main>
        <fieldset>
            <label for="nome">Nome</label>
            <input type="text" name="nome" id="nome">

            <label for="email">E-mail</label>
            <input type="email" name="email" id="email">

            <label for="DataNascimento">Data de nascimento</label>
            <input type="date" name="data de nascimento" id="DataNascimento">

            <label for="telefone">Telefone</label>
            <input type="tel" name="telefone" id="telefone">

            <input type="button" value="Registrar" id="botao">

        </fieldset>

        <fieldset id="registro">
            <p class="registro">Data:</p>
            <p class="registro">Hora:</p>
        </fieldset>
    </main>

    <footer>
        <p id="footer">&copy; GuilhermeRodrigues</p>            
    </footer>
</body>
</html>
