<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evento ~mousedown~</title>

    <link rel="stylesheet" href="../../estilogeral.css">

</head>
<body>
    <header>
        <h1>Evento mousedown</h1>
    </header>    
        
    <main>
        <div>
            <fieldset id="quadrado">
                <p id="passe"></p>
            </fieldset>   
        </div>
    </main>
    
    <footer>&copy; GuilhermeRodrigues</footer>

    <script>
        let quadrado = window.document.querySelector('#quadrado')
        let p = window.document.querySelector("#passe")
        quadrado.addEventListener("mousedown", pressione)

        function pressione() {
            quadrado.style.backgroundColor = 'green'
            p.textContent = 'Mouse pressionado!'
        }
    </script>

</body>
</html>
